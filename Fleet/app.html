<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FleetLog – Vehicle database demo</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#14212b;--paper:#eef0f2;--line:#cfd5da;--amber:#f2b01e;--ok:#2e7d5b;--bad:#c8452f;--mute:#5b6770}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 Barlow,system-ui,sans-serif;color:var(--ink);background:var(--paper)}
h2,h3{font-family:'Barlow Condensed','Arial Narrow',sans-serif;margin:0 0 8px;line-height:1.1}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
header{background:var(--ink);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;font:700 22px 'Barlow Condensed',sans-serif;text-decoration:none}
.app{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 52px)}
.side{background:#f6f7f8;border-right:2px solid var(--ink);padding:14px}
.main{padding:18px;min-width:0;background:#fff}
.veh{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px 10px;margin-bottom:6px;cursor:pointer;font:inherit}
.veh.on{border:2px solid var(--ink);background:#fff7e0}.veh small{display:block;color:var(--mute)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--ink);margin:12px 0 16px}
.tabs button{border:0;background:#e3e7ea;padding:8px 16px;font:600 15px Barlow;cursor:pointer;border-radius:4px 4px 0 0}
.tabs button.on{background:var(--ink);color:#fff}
.plate{font:700 24px 'Barlow Condensed';border:2px solid var(--ink);border-radius:4px;padding:0 10px}
.btn{background:var(--amber);color:var(--ink);font:600 15px Barlow;padding:8px 16px;border:0;border-radius:4px;cursor:pointer}
.btn.sm{padding:3px 10px;font-size:13px;background:#e3e7ea}
.x{background:none;border:0;color:var(--bad);cursor:pointer;font:inherit}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end;margin-bottom:10px}
label{font-size:13px;font-weight:600;display:block}
input,select{width:100%;font:inherit;padding:7px;border:1px solid #98a2aa;border-radius:4px;margin-top:3px;background:#fff}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.stat{flex:1 1 120px;border:1px solid var(--line);border-radius:4px;padding:6px 10px}
.stat b{display:block;font:700 24px 'Barlow Condensed'}.stat span{font-size:12px;color:var(--mute)}
.tag{display:inline-block;margin:0 6px 6px 0;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;color:#fff}
.ok{background:var(--ok)}.soon{background:#b9830b}.over{background:var(--bad)}
.panel{border:1px dashed #98a2aa;border-radius:4px;padding:12px;margin-bottom:14px;background:#fafbfb}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#f0f2f4}
.table{overflow-x:auto}
img.ph{width:48px;height:48px;object-fit:cover;border-radius:4px}
.warn{color:var(--bad);font-weight:600;font-size:13px}
.m{color:var(--mute);font-size:13px}
.modes button{background:#2a3945;color:#fff;border:0;padding:5px 12px;font:600 14px Barlow;cursor:pointer;border-radius:4px}.modes .on{background:var(--amber);color:var(--ink)}
.cam{position:fixed;inset:0;background:#000;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}.cam video{max-width:100%;max-height:75vh}
.invdoc{max-width:760px;margin-top:14px;border:1px solid var(--line);padding:20px}
@media print{.invp .hd{display:none}.invdoc{border:0}}
@media(max-width:720px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:2px solid var(--ink)}}
@media print{header,.side,.tabs,.noprint{display:none}.app{display:block}}
</style>
</head>
<body>
<header><a href="index.html">FleetLog</a><div class="modes"><button id="m_biz">Business</button> <button id="m_personal">Personal tracker</button></div></header>
<div class="app"><div class="side"><strong>Vehicles</strong><div id="vl" style="margin:8px 0"></div>
<form id="vf"><label>Plate<input id="vp" required maxlength="12"></label><label style="margin-top:6px">Model<input id="vm" required maxlength="30"></label><button class="btn" style="margin-top:8px;width:100%">Add vehicle</button></form></div>
<div class="main" id="main"></div></div>
<script>
const KEY='fleetlog-db-v2',$=id=>document.getElementById(id),DAY=864e5;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const ago=d=>Date.now()-d*DAY;
let tab='log',db=null,pend=null,draft=null,invView=null;
try{db=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
if(!db){db={sel:'v1',
 types:[['Oil change',10000,180],['Tyre change',40000,730],['Brake service',30000,365],['Battery',60000,730],['Air filter',20000,365],['Coolant',40000,730],['Transmission oil',60000,1095],['Wheel alignment',10000,180],['AC service',0,365],['Periodic inspection',0,365]].map(t=>({id:uid(),name:t[0],km:t[1],days:t[2]})),
 fields:[['Owner name','text'],['Owner phone','text'],['Driver name','text'],['Driver phone','text'],['Vehicle type (bus, lorry, car)','text'],['Capacity (seats or load in tons)','text'],['Fuel tank (litres)','number'],['Chassis / VIN','text'],['Engine number','text'],['Registration expiry','date'],['Insurance expiry','date']].map(f=>({id:uid(),label:f[0],kind:f[1]})),
 v:[]};
 const o=db.types[0].id,b=db.types[2].id;
 db.v=[{id:'v1',plate:'KSA 4821',model:'Toyota Hiace Bus',freq:1,f:{[db.fields[0].id]:'Al Noor Transport',[db.fields[2].id]:'Ahmed K.',[db.fields[5].id]:'14 seats',[db.fields[9].id]:new Date(Date.now()+20*DAY).toISOString().slice(0,10)},
  e:[{id:uid(),k:'c',ts:ago(30),odo:48200,h:'Good',note:'',img:''},{id:uid(),k:'s',ts:ago(28),odo:48230,t:o,cost:180,note:'Synthetic 5W-30',img:''},{id:uid(),k:'f',ts:ago(20),odo:49100,l:60,cost:90,note:'',img:''},{id:uid(),k:'c',ts:ago(10),odo:50600,h:'Warning',note:'Engine noise at idle',img:''},{id:uid(),k:'f',ts:ago(5),odo:51500,l:62,cost:93,note:'',img:''},{id:uid(),k:'s',ts:ago(3),odo:51700,t:b,cost:640,note:'Front pads',img:''},{id:uid(),k:'c',ts:ago(2),odo:52900,h:'Good',note:'Odometer jump',img:''}]}];}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Browser storage is full. Delete some photos or entries.')}};
db.mode=db.mode||'biz';db.biz=db.biz||{name:'',addr:'',tax:'',cur:'$',terms:'Payment due within 14 days.',no:1};db.inv=db.inv||[];
const cur=()=>db.v.find(v=>v.id===db.sel);
const fd=ts=>new Date(ts).toLocaleString([], {dateStyle:'medium',timeStyle:'short'});
const sorted=v=>[...v.e].sort((a,b)=>a.ts-b.ts);
const odoOf=v=>v.e.reduce((m,x)=>Math.max(m,x.odo||0),0);
const tname=id=>db.types.find(t=>t.id===id)?.name||'(removed type)';

function analyse(v){
 const s=sorted(v).filter(x=>x.odo!=null),flags=[];let km=0;
 const span=s.length>1?Math.max(1,(s.at(-1).ts-s[0].ts)/DAY):1,avg=s.length>1?(s.at(-1).odo-s[0].odo)/span:0;
 for(let i=1;i<s.length;i++){
  const d=s[i].odo-s[i-1].odo,days=Math.max(.04,(s[i].ts-s[i-1].ts)/DAY),rate=d/days;
  if(d<0)flags.push(`${fd(s[i].ts)}: odometer went backwards by ${-d} km`);
  else if(s.length>3&&avg>0&&rate>3*avg&&d>200)flags.push(`${fd(s[i].ts)}: ${Math.round(rate)} km/day, over 3x the average of ${Math.round(avg)}`);
 }
 s.forEach(x=>{if(x.pts&&Math.abs(x.pts-x.ts)>36e5)flags.push(`${fd(x.ts)}: photo taken ${fd(x.pts)}, not at entry time`)});
 const f=v.e.filter(x=>x.k==='f').sort((a,b)=>a.ts-b.ts),litres=f.reduce((a,x)=>a+(+x.l||0),0),fuelCost=f.reduce((a,x)=>a+(+x.cost||0),0);
 let kmpl=null;if(f.length>1){const dist=f.at(-1).odo-f[0].odo,lt=litres-f[0].l;if(dist>0&&lt>0)kmpl=dist/lt}
 const sv=v.e.filter(x=>x.k==='s'),svCost=sv.reduce((a,x)=>a+(+x.cost||0),0);
 km=s.length>1?s.at(-1).odo-s[0].odo:0;
 const hc=v.e.filter(x=>x.k==='c').sort((a,b)=>b.ts-a.ts)[0];
 return {flags,avg,km,litres,fuelCost,kmpl,sv,svCost,health:hc?.h||'No check-in',healthTs:hc?.ts,lastCheck:hc?.ts||0,span};
}
function tags(v){
 const odo=odoOf(v),now=Date.now(),out=[];
 db.types.forEach(t=>{
  const l=v.e.filter(x=>x.k==='s'&&x.t===t.id).sort((a,b)=>b.ts-a.ts)[0];
  if(!l){out.push(['soon',t.name+': no record']);return}
  const kl=t.km?l.odo+t.km-odo:null,dl=t.days?Math.ceil((l.ts+t.days*DAY-now)/DAY):null;
  const bad=(kl!==null&&kl<0)||(dl!==null&&dl<0),near=(kl!==null&&kl<1000)||(dl!==null&&dl<14);
  out.push([bad?'over':near?'soon':'ok',`${t.name}: ${[kl!==null?(kl<0?-kl+' km over':kl+' km left'):'',dl!==null?(dl<0?-dl+' days over':dl+' days left'):''].filter(Boolean).join(' / ')}`]);
 });
 db.fields.filter(f=>f.kind==='date'&&v.f[f.id]).forEach(f=>{const d=Math.ceil((new Date(v.f[f.id])-now)/DAY);out.push([d<0?'over':d<30?'soon':'ok',`${f.label}: ${d<0?-d+' days expired':d+' days left'}`])});
 const a=analyse(v),need=(v.freq||1)*DAY;
 out.unshift([!a.lastCheck||now-a.lastCheck>need*1.5?'over':now-a.lastCheck>need?'soon':'ok',`${v.freq===7?'Weekly':'Daily'} odometer check-in: ${a.lastCheck?'last '+fd(a.lastCheck):'none yet'}`]);
 return out.map(t=>`<span class="tag ${t[0]}">${esc(t[1])}</span>`).join('');
}
function shrink(file,stamp){return new Promise(res=>{const r=new FileReader();r.onerror=()=>res('');r.onload=()=>{const i=new Image();i.onerror=()=>res('');i.onload=()=>{const s=Math.min(1,420/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;const g=c.getContext('2d');g.drawImage(i,0,0,c.width,c.height);if(stamp)stampIt(g,c.width,c.height,file.lastModified||Date.now());res(c.toDataURL('image/jpeg',.7))};i.src=r.result};r.readAsDataURL(file)})}

function stampIt(g,w,h,ts){const s=Math.max(12,Math.round(w/26));g.font='bold '+s+'px sans-serif';g.fillStyle='rgba(0,0,0,.65)';g.fillRect(0,h-s*1.6,w,s*1.6);g.fillStyle='#f2b01e';g.fillText(new Date(ts).toLocaleString(),s*.5,h-s*.5)}
async function openCam(done){
 if(!navigator.mediaDevices?.getUserMedia){alert('Camera is not available here. Use Upload photo, or open this page over HTTPS.');return}
 let s;try{s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){alert('Camera permission was denied. Allow camera access or use Upload photo.');return}
 const o=document.createElement('div');o.className='cam';o.innerHTML='<video autoplay playsinline muted></video><div><button class="btn" id="snap">Take photo</button> <button class="btn sm" id="cx">Cancel</button></div>';document.body.append(o);
 const v=o.querySelector('video');v.srcObject=s;const stop=()=>{s.getTracks().forEach(x=>x.stop());o.remove()};
 o.querySelector('#cx').onclick=stop;
 o.querySelector('#snap').onclick=()=>{const k=Math.min(1,640/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');c.width=v.videoWidth*k;c.height=v.videoHeight*k;const g=c.getContext('2d');g.drawImage(v,0,0,c.width,c.height);const ts=Date.now();stampIt(g,c.width,c.height,ts);done({img:c.toDataURL('image/jpeg',.7),pts:ts,cam:true});stop()};
}
const money=n=>db.biz.cur+(+n).toFixed(2);
const tot=i=>{const sub=i.lines.reduce((a,l)=>a+l.q*l.p,0),tax=sub*i.tax/100;return{sub,tax,total:sub+tax}};
function viewInv(v){
 if(invView){const i=db.inv.find(x=>x.id===invView);if(i)return invDoc(i)}
 const b=db.biz,d=draft||(draft={client:'',addr:'',due:14,tax:0,lines:[{d:'',q:1,p:0}]});
 return `<div class="panel"><strong>Your business details</strong><form id="bf" class="grid" style="margin-top:8px">
 <label>Business name<input name="name" value="${esc(b.name)}"></label><label>Address<input name="addr" value="${esc(b.addr)}"></label><label>Tax / VAT no.<input name="tax" value="${esc(b.tax)}"></label><label>Currency symbol<input name="cur" value="${esc(b.cur)}" maxlength="4"></label><label>Terms<input name="terms" value="${esc(b.terms)}"></label><button class="btn sm">Save business</button></form></div>
 <div class="panel"><strong>New invoice</strong><form id="nf" style="margin-top:8px"><div class="grid"><label>Client name<input id="ic" required value="${esc(d.client)}"></label><label>Client address<input id="ia" value="${esc(d.addr)}"></label><label>Due in (days)<input type="number" id="idu" min="0" value="${d.due}"></label><label>Tax %<input type="number" id="it" min="0" step="0.01" value="${d.tax}"></label></div>
 <div class="table"><table><tr><th>Description</th><th>Qty</th><th>Unit price</th><th></th></tr>${d.lines.map((l,i)=>`<tr><td><input data-l="${i}" data-c="d" value="${esc(l.d)}"></td><td><input type="number" data-l="${i}" data-c="q" min="0" step="any" value="${l.q}"></td><td><input type="number" data-l="${i}" data-c="p" min="0" step="0.01" value="${l.p}"></td><td><button type="button" class="x" data-rl="${i}">Remove</button></td></tr>`).join('')}</table></div>
 <button type="button" class="btn sm" id="al">Add line</button> <button type="button" class="btn sm" id="pl">Add this vehicle's services and fuel</button> <button class="btn">Create invoice</button></form></div>
 <h3>Invoices</h3><div class="table"><table><tr><th>No.</th><th>Date</th><th>Client</th><th>Total</th><th>Status</th><th></th></tr>${[...db.inv].reverse().map(i=>`<tr><td>${esc(i.no)}</td><td>${new Date(i.ts).toLocaleDateString()}</td><td>${esc(i.client)}</td><td>${money(tot(i).total)}</td><td>${i.paid?'Paid':'Unpaid'}</td><td><button class="btn sm" data-iv="${i.id}">Open</button> <button class="btn sm" data-ip="${i.id}">${i.paid?'Mark unpaid':'Mark paid'}</button> <button class="x" data-id2="${i.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="6" class="m">No invoices yet.</td></tr>'}</table></div>`}
function invDoc(i){const t=tot(i),b=db.biz;
 return `<div class="noprint"><button class="btn" id="bk">Back to invoices</button> <button class="btn" onclick="window.print()">Print or save PDF</button></div>
 <div class="invdoc"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px"><div><h2>${esc(b.name)||'Your business'}</h2><div class="m">${esc(b.addr)}${b.tax?'<br>Tax no. '+esc(b.tax):''}</div></div><div style="text-align:right"><h2>Invoice ${esc(i.no)}</h2>Date: ${new Date(i.ts).toLocaleDateString()}<br>Due: ${new Date(i.ts+i.due*DAY).toLocaleDateString()}<br><b>${i.paid?'PAID':'UNPAID'}</b></div></div>
 <p><b>Bill to</b><br>${esc(i.client)}<br>${esc(i.addr)}</p>
 <table><tr><th>Description</th><th>Qty</th><th>Unit price</th><th>Amount</th></tr>${i.lines.map(l=>`<tr><td>${esc(l.d)}</td><td>${l.q}</td><td>${money(l.p)}</td><td>${money(l.q*l.p)}</td></tr>`).join('')}</table>
 <p style="text-align:right">Subtotal ${money(t.sub)}<br>Tax (${i.tax}%) ${money(t.tax)}<br><b style="font-size:20px">Total ${money(t.total)}</b></p><p class="m">${esc(b.terms)}</p></div>`}
function bindInv(v){
 if(invView){$('bk').onclick=()=>{invView=null;render()};return}
 const d=draft;
 $('bf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);['name','addr','tax','cur','terms'].forEach(k=>db.biz[k]=f.get(k));save();render()};
 const grab=()=>{d.client=$('ic').value;d.addr=$('ia').value;d.due=+$('idu').value;d.tax=+$('it').value;document.querySelectorAll('[data-l]').forEach(i=>{const l=d.lines[+i.dataset.l];l[i.dataset.c]=i.dataset.c==='d'?i.value:+i.value})};
 $('nf').oninput=grab;
 $('al').onclick=()=>{grab();d.lines.push({d:'',q:1,p:0});render()};
 document.querySelectorAll('[data-rl]').forEach(b=>b.onclick=()=>{grab();d.lines.splice(+b.dataset.rl,1);if(!d.lines.length)d.lines.push({d:'',q:1,p:0});render()});
 $('pl').onclick=()=>{grab();v.e.filter(x=>x.k==='s'&&x.cost).forEach(x=>d.lines.push({d:tname(x.t)+' - '+new Date(x.ts).toLocaleDateString()+' - '+v.plate,q:1,p:x.cost}));const fu=v.e.filter(x=>x.k==='f');if(fu.length)d.lines.push({d:'Fuel - '+v.plate,q:1,p:fu.reduce((a,x)=>a+(+x.cost||0),0)});d.lines=d.lines.filter(l=>l.d||l.p);render()};
 $('nf').onsubmit=e=>{e.preventDefault();grab();const no='INV-'+String(db.biz.no++).padStart(4,'0');db.inv.push({id:uid(),no,ts:Date.now(),client:d.client,addr:d.addr,due:d.due,tax:d.tax,lines:d.lines.filter(l=>l.d||l.p),vid:v.id,paid:false});draft=null;save();render()};
 document.querySelectorAll('[data-iv]').forEach(b=>b.onclick=()=>{invView=b.dataset.iv;render()});
 document.querySelectorAll('[data-ip]').forEach(b=>b.onclick=()=>{const i=db.inv.find(x=>x.id===b.dataset.ip);i.paid=!i.paid;save();render()});
 document.querySelectorAll('[data-id2]').forEach(b=>b.onclick=()=>{if(confirm('Delete this invoice?')){db.inv=db.inv.filter(x=>x.id!==b.dataset.id2);save();render()}});
}
function list(){
 $('vl').innerHTML=db.v.map(v=>`<button class="veh ${v.id===db.sel?'on':''}" data-id="${v.id}"><b>${esc(v.plate)}</b><small>${esc(v.model)}</small></button>`).join('')||'<p class="m">No vehicles yet.</p>';
 $('vl').querySelectorAll('button').forEach(b=>b.onclick=()=>{db.sel=b.dataset.id;save();render()});
}
function entryRows(v,photos){return [...v.e].sort((a,b)=>b.ts-a.ts).map(x=>`<tr><td>${fd(x.ts)}</td><td>${x.k==='s'?'Service: '+esc(tname(x.t)):x.k==='f'?'Fuel '+x.l+' L':'Odometer check-in'+(x.h?' ('+x.h+')':'')}</td><td>${x.odo!=null?x.odo.toLocaleString():''}</td><td>${x.cost?'$'+x.cost:''}</td><td>${esc(x.note)}</td><td>${x.img?`<img class="ph" src="${x.img}" alt="Odometer or part photo">`:''}${x.pts?`<div class="m">${x.cam?'Camera':'Photo'}: ${fd(x.pts)}</div>`:''}</td><td class="noprint"><button class="x" data-del="${x.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="7" class="m">No entries yet.</td></tr>'}

function viewLog(v){return `<div class="panel"><strong>Add entry</strong><form id="ef" style="margin-top:8px"><div class="grid">
 <label>Entry type<select id="ek"><option value="c">Odometer check-in</option><option value="s">Service</option><option value="f">Fuel fill</option></select></label>
 <label>Date and time<input type="datetime-local" id="ets" required></label>
 <label>Odometer (km)<input type="number" id="eo" min="0" required></label>
 <label id="lt" hidden>Service type<select id="et">${db.types.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></label>
 <label id="ll" hidden>Litres<input type="number" id="el" min="0" step="0.1"></label>
 <label id="lh">Engine health<select id="eh"><option>Good</option><option>Warning</option><option>Critical</option></select></label>
 <label>Cost ($)<input type="number" id="ec" min="0" step="0.01"></label>
 <label>Notes or parts<input id="en" maxlength="120"></label>
 <div style="grid-column:1/-1"><strong class="m">Photo (odometer, part, invoice)</strong><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px"><button type="button" class="btn sm" id="cam">Open camera</button><label class="btn sm" style="margin:0;cursor:pointer">Upload photo<input type="file" id="ei" accept="image/*" hidden></label><label style="font-weight:500"><input type="checkbox" id="stp" checked style="width:auto"> Print date and time on uploads</label><span id="pv"></span></div></div></div><button class="btn">Save entry</button></form></div>
 <div class="table"><table><tr><th>When</th><th>What</th><th>km</th><th>Cost</th><th>Notes</th><th>Photo</th><th class="noprint"></th></tr>${entryRows(v)}</table></div>`}

function viewReport(v){const a=analyse(v);
 const det=db.fields.map(f=>`<tr><th style="width:40%">${esc(f.label)}</th><td>${esc(v.f[f.id])||'<span class="m">not set</span>'}</td></tr>`).join('');
 return `<button class="btn noprint" onclick="window.print()">Print or save PDF</button> <button class="btn sm noprint" id="csv">Download CSV</button>
 <div class="stats"><div class="stat"><b>${odoOf(v).toLocaleString()}</b><span>Odometer km</span></div><div class="stat"><b>${a.km.toLocaleString()}</b><span>Total km logged</span></div>
 <div class="stat"><b>${Math.round(a.avg)}</b><span>Average km per day</span></div><div class="stat"><b>${a.sv.length}</b><span>Services done</span></div>
 <div class="stat"><b>$${a.svCost.toLocaleString()}</b><span>Service cost</span></div><div class="stat"><b>${a.litres.toFixed(1)} L</b><span>Fuel consumed</span></div>
 <div class="stat"><b>${a.kmpl?a.kmpl.toFixed(1):'n/a'}</b><span>km per litre</span></div><div class="stat"><b>${a.km?'$'+((a.fuelCost+a.svCost)/a.km).toFixed(2):'n/a'}</b><span>Cost per km</span></div>
 <div class="stat"><b>${esc(a.health)}</b><span>Engine health${a.healthTs?' ('+fd(a.healthTs)+')':''}</span></div></div>
 <h3>Checks</h3>${a.flags.length?a.flags.map(f=>`<div class="warn">&#9888; ${esc(f)}</div>`).join(''):'<div class="m">No odometer problems found.</div>'}
 <div class="m" style="margin:6px 0 14px">Photos are compared by entry time and photo time. Reading the number from the image automatically needs the cloud version.</div>
 <h3>Owner, driver and vehicle details</h3><div class="table"><table>${det}</table></div>
 <h3 style="margin-top:14px">Due and expiry status</h3>${tags(v)}
 <h3 style="margin-top:14px">Full history</h3><div class="table"><table><tr><th>When</th><th>What</th><th>km</th><th>Cost</th><th>Notes</th><th>Photo</th><th class="noprint"></th></tr>${entryRows(v)}</table></div>`}

function viewSet(v){return `<div class="panel"><strong>Vehicle details</strong><form id="df" style="margin-top:8px"><div class="grid">
 <label>Plate<input name="plate" value="${esc(v.plate)}"></label><label>Model<input name="model" value="${esc(v.model)}"></label>
 <label>Odometer check-in<select name="freq"><option value="1" ${v.freq!==7?'selected':''}>Every day</option><option value="7" ${v.freq===7?'selected':''}>Every week</option></select></label>
 ${db.fields.map(f=>`<label>${esc(f.label)}<input name="f_${f.id}" type="${f.kind}" value="${esc(v.f[f.id])}"></label>`).join('')}</div><button class="btn">Save details</button> <button type="button" class="x" id="dv">Delete vehicle</button></form></div>
 <div class="panel"><strong>Detail fields for all vehicles</strong><p class="m">Add what your business needs. Remove what you do not use.</p>
 ${db.fields.map(f=>`<div>${esc(f.label)} <span class="m">(${f.kind})</span> <button class="x" data-rf="${f.id}">Remove</button></div>`).join('')}
 <form id="ff" class="grid" style="margin-top:8px"><label>New field name<input id="fn" required maxlength="40" placeholder="e.g. Route, Trailer plate"></label><label>Field type<select id="fk"><option value="text">Text</option><option value="number">Number</option><option value="date">Date (expiry alert)</option></select></label><button class="btn">Add field</button></form></div>
 <div class="panel"><strong>Service types and limits</strong><p class="m">Set a limit by kilometres, days, or both. Leave 0 to ignore a limit.</p>
 <div class="table"><table><tr><th>Service</th><th>Every km</th><th>Every days</th><th></th></tr>${db.types.map(t=>`<tr><td>${esc(t.name)}</td><td><input type="number" min="0" value="${t.km}" data-tk="${t.id}"></td><td><input type="number" min="0" value="${t.days}" data-td="${t.id}"></td><td><button class="x" data-rt="${t.id}">Remove</button></td></tr>`).join('')}</table></div>
 <form id="tf" class="grid" style="margin-top:8px"><label>New service<input id="tn" required maxlength="40" placeholder="e.g. Clutch, Speed limiter"></label><label>Every km<input type="number" id="tk" min="0" value="0"></label><label>Every days<input type="number" id="td" min="0" value="0"></label><button class="btn">Add service type</button></form></div>`}

function render(){
 if(db.mode!=='biz'&&tab==='inv')tab='log';document.body.classList.toggle('invp',tab==='inv'&&!!invView);['biz','personal'].forEach(k=>$('m_'+k).classList.toggle('on',db.mode===k));list();const v=cur(),m=$('main');
 if(!v){m.innerHTML='<p class="m">Add your first vehicle on the left.</p>';return}
 m.innerHTML=`<div class="m noprint" style="margin-bottom:6px">${db.mode==='biz'?'Business mode: fleet records, reports and invoices.':'Personal mode: simple record keeping for your own vehicles.'} Demo data stays in this browser.</div><div class="hd"><span class="plate">${esc(v.plate)}</span> <span style="margin-left:8px">${esc(v.model)}</span><div style="margin-top:10px">${tags(v)}</div></div>
 <div class="tabs noprint">${[['log','Log'],['rep','Report'],...(db.mode==='biz'?[['inv','Invoices']]:[]),['set','Settings']].map(t=>`<button data-tab="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div>
 ${tab==='log'?viewLog(v):tab==='rep'?viewReport(v):tab==='inv'?viewInv(v):viewSet(v)}`;
 m.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;invView=null;render()});
 m.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{v.e=v.e.filter(x=>x.id!==b.dataset.del);save();render()});
 if(tab==='log')bindLog(v);if(tab==='rep')$('csv').onclick=()=>csv(v);if(tab==='set')bindSet(v);if(tab==='inv')bindInv(v);
}
function bindLog(v){
 const k=$('ek'),sync=()=>{$('lt').hidden=k.value!=='s';$('ll').hidden=k.value!=='f';$('lh').hidden=k.value!=='c';$('el').required=k.value==='f'};
 k.onchange=sync;sync();
 const n=new Date();n.setMinutes(n.getMinutes()-n.getTimezoneOffset());$('ets').value=n.toISOString().slice(0,16);$('eo').value=odoOf(v)||'';
 pend=null;const pv=()=>{$('pv').innerHTML=pend?.img?'<img class="ph" src="'+pend.img+'" alt="Attached photo"> <button type="button" class="x" id="rp">Remove</button>':'';if(pend?.img)$('rp').onclick=()=>{pend=null;pv()}};
 $('ei').onchange=async()=>{const f=$('ei').files[0];if(!f)return;pend={img:await shrink(f,$('stp').checked),pts:f.lastModified};pv()};
 $('cam').onclick=()=>openCam(p=>{pend=p;pv()});
 $('ef').onsubmit=async e=>{e.preventDefault();const x={id:uid(),k:k.value,ts:new Date($('ets').value).getTime(),odo:+$('eo').value,cost:+$('ec').value||0,note:$('en').value.trim(),img:pend?.img||'',pts:pend?.pts||0,cam:!!pend?.cam};
  if(x.k==='s')x.t=$('et').value;if(x.k==='f')x.l=+$('el').value;if(x.k==='c')x.h=$('eh').value;v.e.push(x);save();render()};
}
function bindSet(v){
 $('df').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);v.plate=d.get('plate').toUpperCase();v.model=d.get('model');v.freq=+d.get('freq');db.fields.forEach(f=>v.f[f.id]=d.get('f_'+f.id));save();render()};
 $('dv').onclick=()=>{if(confirm('Delete '+v.plate+' and all its history?')){db.v=db.v.filter(x=>x!==v);db.sel=db.v[0]?.id;save();render()}};
 $('ff').onsubmit=e=>{e.preventDefault();db.fields.push({id:uid(),label:$('fn').value.trim(),kind:$('fk').value});save();render()};
 $('tf').onsubmit=e=>{e.preventDefault();db.types.push({id:uid(),name:$('tn').value.trim(),km:+$('tk').value||0,days:+$('td').value||0});save();render()};
 document.querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>{if(confirm('Remove this field from all vehicles?')){db.fields=db.fields.filter(f=>f.id!==b.dataset.rf);save();render()}});
 document.querySelectorAll('[data-rt]').forEach(b=>b.onclick=()=>{if(confirm('Remove this service type? Past entries keep a "removed type" label.')){db.types=db.types.filter(t=>t.id!==b.dataset.rt);save();render()}});
 document.querySelectorAll('[data-tk]').forEach(i=>i.onchange=()=>{db.types.find(t=>t.id===i.dataset.tk).km=+i.value||0;save();render()});
 document.querySelectorAll('[data-td]').forEach(i=>i.onchange=()=>{db.types.find(t=>t.id===i.dataset.td).days=+i.value||0;save();render()});
}
function csv(v){
 const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"',rows=[['When','Type','Odometer','Litres','Cost','Notes','Photo time']];
 sorted(v).forEach(x=>rows.push([new Date(x.ts).toISOString(),x.k==='s'?tname(x.t):x.k==='f'?'Fuel':'Check-in',x.odo,x.l||'',x.cost||'',x.note,x.pts?new Date(x.pts).toISOString():'']));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download=v.plate.replace(/\W/g,'')+'-history.csv';a.click();
}
$('vf').onsubmit=e=>{e.preventDefault();const v={id:uid(),plate:$('vp').value.trim().toUpperCase(),model:$('vm').value.trim(),freq:1,f:{},e:[]};db.v.push(v);db.sel=v.id;tab='set';save();e.target.reset();render()};
['biz','personal'].forEach(k=>$('m_'+k).onclick=()=>{db.mode=k;save();render()});
render();
</script>
</body>
</html>

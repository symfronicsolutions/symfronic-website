<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FleetLog – Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--ink:#14212b;--line:#cfd5da;--amber:#f2b01e;--ok:#2e7d5b;--bad:#c8452f;--mute:#5b6770}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 Barlow,system-ui,sans-serif;color:var(--ink);background:#eef0f2}
h2,h3{font-family:'Barlow Condensed','Arial Narrow',sans-serif;margin:0 0 8px}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
header{background:var(--ink);color:#fff;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header b{font:700 22px 'Barlow Condensed'}
.app{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 50px)}
.side{background:#f6f7f8;border-right:2px solid var(--ink);padding:14px}
.main{background:#fff;padding:18px;min-width:0}
.box{max-width:380px;margin:60px auto;background:#fff;padding:24px;border:2px solid var(--ink);border-radius:6px}
.veh{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px;margin-bottom:6px;cursor:pointer;font:inherit}
.veh.on{border:2px solid var(--ink);background:#fff7e0}
.btn{background:var(--amber);color:var(--ink);font:600 15px Barlow;padding:8px 16px;border:0;border-radius:4px;cursor:pointer}
.btn.sm{padding:3px 10px;font-size:13px;background:#e3e7ea}
.x{background:none;border:0;color:var(--bad);cursor:pointer;font:inherit}
label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}
input,select{width:100%;font:inherit;padding:7px;border:1px solid #98a2aa;border-radius:4px;margin-top:3px;background:#fff}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--ink);margin:12px 0}
.tabs button{border:0;background:#e3e7ea;padding:7px 16px;font:600 15px Barlow;cursor:pointer;border-radius:4px 4px 0 0}
.tabs .on{background:var(--ink);color:#fff}
.panel{border:1px dashed #98a2aa;border-radius:4px;padding:12px;margin:12px 0;background:#fafbfb}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.stat{flex:1 1 120px;border:1px solid var(--line);padding:6px 10px;border-radius:4px}
.stat b{display:block;font:700 24px 'Barlow Condensed'}.stat span{font-size:12px;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.t{overflow-x:auto}img.ph{width:52px;height:52px;object-fit:cover;border-radius:4px}
.warn{color:var(--bad);font-weight:600;font-size:13px}.m{color:var(--mute);font-size:13px}
.cam{position:fixed;inset:0;background:#000;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}.cam video{max-width:100%;max-height:75vh}
@media(max-width:720px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:2px solid var(--ink)}}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* SETUP: paste your Supabase project values (Project Settings > API). The anon key is public by design;
   your data is protected by the row level security rules in fleetlog-schema.sql. Never paste the service_role key here. */
const SB_URL='https://jdfkpjjsutbdhrafhlez.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpkZmtwampzdXRiZGhyYWZobGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExOTcxOTYsImV4cCI6MjEwNjc3MzE5Nn0.rnjtED5cjcY0PfEWGIBRLdGyB40r9GVDZe04KwQC_Lw';

const $=id=>document.getElementById(id),root=$('root');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=t=>new Date(t).toLocaleString([], {dateStyle:'medium',timeStyle:'short'});
const FLAG={odometer_backwards:'Odometer went backwards',photo_time_mismatch:'Photo time differs from entry time',backdated:'Entry was backdated'};
if(SB_URL.startsWith('YOUR_')||SB_KEY.startsWith('YOUR_')){root.innerHTML='<div class="box"><h2>Setup needed</h2><p>Open <code>cloud.html</code> and paste your Supabase URL and public key at the top of the script.</p></div>';throw new Error('not configured')}
const sb=supabase.createClient(SB_URL,SB_KEY);
const S={user:null,acc:null,role:null,types:[],veh:[],sel:null,ent:[],urls:{},tab:'log'};
let pend=null;
const can=(...r)=>r.includes(S.role);
const fail=e=>{root.innerHTML='<div class="box"><h2>Something went wrong</h2><p class="warn">'+esc(e.message||e)+'</p><button class="btn" onclick="boot()">Try again</button></div>'};

async function boot(){const {data}=await sb.auth.getSession();S.user=data.session?.user||null;S.user?loadAcc():authView()}

function authView(){
 root.innerHTML=`<div class="box"><h2>FleetLog</h2><form id="af"><label>Email<input id="ae" type="email" required></label><label>Password (8+ characters)<input id="ap" type="password" minlength="8" required></label>
 <button class="btn">Sign in</button> <button type="button" class="btn sm" id="su">Create account</button><p class="warn" id="am"></p></form></div>`;
 $('af').onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:$('ae').value,password:$('ap').value});error?$('am').textContent=error.message:boot()};
 $('su').onclick=async()=>{const {data,error}=await sb.auth.signUp({email:$('ae').value,password:$('ap').value});
  if(error)$('am').textContent=error.message;else if(data.session)boot();else $('am').textContent='Check your email to confirm, then sign in.'};
}
async function loadAcc(){
 const {data,error}=await sb.from('members').select('role,accounts(*)').limit(1);
 if(error)return fail(error);
 if(!data.length)return setupView();
 S.role=data[0].role;S.acc=data[0].accounts;loadData();
}
function setupView(){
 root.innerHTML=`<div class="box"><h2>Set up your account</h2><form id="sf"><label>Name (business or your own)<input id="sn" required maxlength="60"></label>
 <label>Account type<select id="st"><option value="business">Business: team, reports and invoices</option><option value="personal">Personal tracker: my own vehicles</option></select></label><button class="btn">Create account</button></form></div>`;
 $('sf').onsubmit=async e=>{e.preventDefault();const {error}=await sb.rpc('create_account',{p_name:$('sn').value.trim(),p_type:$('st').value});error?fail(error):loadAcc()};
}
async function loadData(){
 const [t,v]=await Promise.all([sb.from('service_types').select('*').eq('active',true).order('name'),sb.from('vehicles').select('*').eq('archived',false).order('plate')]);
 if(t.error||v.error)return fail(t.error||v.error);
 S.types=t.data;S.veh=v.data;if(!S.veh.find(x=>x.id===S.sel))S.sel=S.veh[0]?.id||null;loadEnt();
}
async function loadEnt(){
 S.ent=[];S.urls={};
 if(S.sel){const {data,error}=await sb.from('entries').select('*').eq('vehicle_id',S.sel).order('occurred_at',{ascending:false});
  if(error)return fail(error);S.ent=data;
  const ps=S.ent.filter(e=>e.photo_path).map(e=>e.photo_path);
  if(ps.length){const {data:u}=await sb.storage.from('entry-photos').createSignedUrls(ps,3600);(u||[]).forEach(x=>S.urls[x.path]=x.signedUrl)}}
 render();
}
const tn=id=>S.types.find(t=>t.id===id)?.name||'Service';
function stats(){
 const a=[...S.ent].reverse(),o=a.filter(e=>e.odometer_km!=null),f=a.filter(e=>e.kind==='fuel'),sv=a.filter(e=>e.kind==='service');
 const L=f.reduce((s,e)=>s+(+e.litres||0),0),km=o.length>1?o.at(-1).odometer_km-o[0].odometer_km:0;
 let kmpl=null;if(f.length>1){const d=f.at(-1).odometer_km-f[0].odometer_km,l=L-(+f[0].litres||0);if(d>0&&l>0)kmpl=d/l}
 const days=o.length>1?Math.max(1,(new Date(o.at(-1).occurred_at)-new Date(o[0].occurred_at))/864e5):1;
 return {odo:Math.max(0,...o.map(e=>+e.odometer_km)),km,avg:km/days,L,kmpl,n:sv.length,svc:sv.reduce((s,e)=>s+(+e.cost||0),0),fc:f.reduce((s,e)=>s+(+e.cost||0),0),
  h:S.ent.find(e=>e.kind==='checkin'&&e.health)?.health||'No check-in',flags:S.ent.filter(e=>e.flags?.length)};
}
function rows(){return S.ent.map(e=>`<tr><td>${fd(e.occurred_at)}</td><td>${e.kind==='service'?'Service: '+esc(tn(e.service_type_id)):e.kind==='fuel'?'Fuel '+e.litres+' L':'Check-in'+(e.health?' ('+e.health+')':'')}</td><td>${e.odometer_km??''}</td><td>${e.cost?e.cost:''}</td><td>${esc(e.note)}${(e.flags||[]).map(f=>`<div class="warn">&#9888; ${FLAG[f]||f}</div>`).join('')}</td>
 <td>${e.photo_path&&S.urls[e.photo_path]?`<img class="ph" src="${S.urls[e.photo_path]}" alt="Entry photo"><div class="m">${e.photo_source==='camera'?'Camera':'Upload'}: ${e.photo_taken_at?fd(e.photo_taken_at):''}</div>`:''}</td>
 <td>${can('owner','manager')?`<button class="x" data-del="${e.id}">Delete</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="m">No entries yet.</td></tr>'}
const head='<tr><th>When</th><th>What</th><th>km</th><th>Cost</th><th>Notes</th><th>Photo</th><th></th></tr>';

function render(){
 const v=S.veh.find(x=>x.id===S.sel);
 root.innerHTML=`<header><b>FleetLog</b><span>${esc(S.acc.name)} &middot; ${S.acc.type==='business'?'Business':'Personal'} &middot; ${S.role} <button class="btn sm" id="so">Sign out</button></span></header>
 <div class="app"><div class="side"><strong>Vehicles</strong><div style="margin:8px 0">${S.veh.map(x=>`<button class="veh ${x.id===S.sel?'on':''}" data-v="${x.id}"><b>${esc(x.plate)}</b><br><span class="m">${esc(x.model)}</span></button>`).join('')||'<p class="m">No vehicles yet.</p>'}</div>
 ${can('owner','manager')?`<form id="vf"><label>Plate<input id="vp" required maxlength="12"></label><label>Model<input id="vm" maxlength="40"></label><label>Type<input id="vc" maxlength="20" placeholder="bus, lorry, car"></label><label>Capacity<input id="vcap" maxlength="20" placeholder="14 seats or 10 tons"></label><button class="btn">Add vehicle</button></form>`:''}</div>
 <div class="main">${v?body(v):'<p class="m">Add your first vehicle to start a log.</p>'}</div></div>`;
 $('so').onclick=async()=>{await sb.auth.signOut();S.user=null;authView()};
 document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.sel=b.dataset.v;loadEnt()});
 if($('vf'))$('vf').onsubmit=async e=>{e.preventDefault();const {data,error}=await sb.from('vehicles').insert({account_id:S.acc.id,plate:$('vp').value.trim().toUpperCase(),model:$('vm').value.trim(),category:$('vc').value.trim(),capacity:$('vcap').value.trim()}).select().single();if(error)return alert(error.message);S.sel=data.id;loadData()};
 if(!v)return;
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this entry?'))return;const {error}=await sb.from('entries').delete().eq('id',b.dataset.del);error?alert(error.message):loadEnt()});
 if(S.tab==='log'&&$('ef'))bindForm();
}
function body(v){
 const s=stats();
 return `<h2>${esc(v.plate)} <span class="m" style="font-size:16px">${esc(v.model)} ${esc(v.category)} ${esc(v.capacity)}</span></h2>
 <div class="tabs"><button data-tab="log" class="${S.tab==='log'?'on':''}">Log</button><button data-tab="rep" class="${S.tab==='rep'?'on':''}">Report</button></div>`+
 (S.tab==='rep'?`<div class="stats"><div class="stat"><b>${s.odo.toLocaleString()}</b><span>Odometer km</span></div><div class="stat"><b>${s.km.toLocaleString()}</b><span>Total km logged</span></div><div class="stat"><b>${Math.round(s.avg)}</b><span>Average km per day</span></div>
 <div class="stat"><b>${s.n}</b><span>Services</span></div><div class="stat"><b>${s.svc.toLocaleString()}</b><span>Service cost</span></div><div class="stat"><b>${s.L.toFixed(1)} L</b><span>Fuel consumed</span></div>
 <div class="stat"><b>${s.kmpl?s.kmpl.toFixed(1):'n/a'}</b><span>km per litre</span></div><div class="stat"><b>${esc(s.h)}</b><span>Engine health</span></div></div>
 <p><button class="btn" onclick="window.print()">Print or save PDF</button></p>
 <h3>Flagged entries</h3>${s.flags.length?s.flags.map(e=>`<div class="warn">&#9888; ${fd(e.occurred_at)}: ${e.flags.map(f=>FLAG[f]||f).join(', ')}</div>`).join(''):'<div class="m">None found.</div>'}
 <h3 style="margin-top:14px">Full history</h3><div class="t"><table>${head}${rows()}</table></div>`
 :`<div class="panel"><strong>Add entry</strong><form id="ef" style="margin-top:8px"><div class="grid">
 <label>Type<select id="ek"><option value="checkin">Odometer check-in</option><option value="service">Service</option><option value="fuel">Fuel fill</option></select></label>
 <label>Date and time<input type="datetime-local" id="ets" required></label><label>Odometer (km)<input type="number" id="eo" min="0" required></label>
 <label id="lt" hidden>Service type<select id="et">${S.types.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></label>
 <label id="ll" hidden>Litres<input type="number" id="el" min="0" step="0.1"></label>
 <label id="lh">Engine health<select id="eh"><option>Good</option><option>Warning</option><option>Critical</option></select></label>
 <label>Cost<input type="number" id="ec" min="0" step="0.01"></label><label>Notes<input id="en" maxlength="120"></label></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0"><button type="button" class="btn sm" id="cam">Open camera</button><label class="btn sm" style="margin:0;cursor:pointer">Upload photo<input type="file" id="ei" accept="image/*" hidden></label>
 <label style="margin:0;font-weight:500"><input type="checkbox" id="stp" checked style="width:auto"> Print date and time on uploads</label><span id="pv"></span></div>
 <button class="btn" id="sv">Save entry</button></form></div><div class="t"><table>${head}${rows()}</table></div>`);
}
function stampIt(g,w,h,ts){const s=Math.max(12,Math.round(w/26));g.font='bold '+s+'px sans-serif';g.fillStyle='rgba(0,0,0,.65)';g.fillRect(0,h-s*1.6,w,s*1.6);g.fillStyle='#f2b01e';g.fillText(new Date(ts).toLocaleString(),s*.5,h-s*.5)}
const toBlob=c=>new Promise(r=>c.toBlob(r,'image/jpeg',.7));
function shrink(file,stamp){return new Promise(res=>{const i=new Image();i.onerror=()=>res(null);i.onload=async()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;const g=c.getContext('2d');g.drawImage(i,0,0,c.width,c.height);if(stamp)stampIt(g,c.width,c.height,file.lastModified||Date.now());URL.revokeObjectURL(i.src);res(await toBlob(c))};i.src=URL.createObjectURL(file)})}
async function openCam(done){
 if(!navigator.mediaDevices?.getUserMedia){alert('Camera is not available here. Use Upload photo, or open the page over HTTPS.');return}
 let s;try{s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){alert('Camera permission was denied.');return}
 const o=document.createElement('div');o.className='cam';o.innerHTML='<video autoplay playsinline muted></video><div><button class="btn" id="snap">Take photo</button> <button class="btn sm" id="cx">Cancel</button></div>';document.body.append(o);
 const v=o.querySelector('video');v.srcObject=s;const stop=()=>{s.getTracks().forEach(x=>x.stop());o.remove()};o.querySelector('#cx').onclick=stop;
 o.querySelector('#snap').onclick=async()=>{const k=Math.min(1,900/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');c.width=v.videoWidth*k;c.height=v.videoHeight*k;const g=c.getContext('2d');g.drawImage(v,0,0,c.width,c.height);const ts=Date.now();stampIt(g,c.width,c.height,ts);const b=await toBlob(c);stop();done({blob:b,pts:ts,src:'camera'})};
}
function bindForm(){
 const k=$('ek'),sync=()=>{$('lt').hidden=k.value!=='service';$('ll').hidden=k.value!=='fuel';$('lh').hidden=k.value!=='checkin'};k.onchange=sync;sync();
 const n=new Date();n.setMinutes(n.getMinutes()-n.getTimezoneOffset());$('ets').value=n.toISOString().slice(0,16);$('eo').value=stats().odo||'';
 pend=null;const pv=()=>{$('pv').innerHTML=pend?'<img class="ph" src="'+URL.createObjectURL(pend.blob)+'" alt="Attached photo"> <button type="button" class="x" id="rp">Remove</button>':'';if(pend)$('rp').onclick=()=>{pend=null;pv()}};
 $('ei').onchange=async()=>{const f=$('ei').files[0];if(!f)return;const b=await shrink(f,$('stp').checked);if(b){pend={blob:b,pts:f.lastModified,src:'upload'};pv()}};
 $('cam').onclick=()=>openCam(p=>{pend=p;pv()});
 $('ef').onsubmit=async e=>{e.preventDefault();$('sv').disabled=true;
  let path=null;
  if(pend){path=`${S.acc.id}/${S.sel}/${crypto.randomUUID()}.jpg`;const {error}=await sb.storage.from('entry-photos').upload(path,pend.blob,{contentType:'image/jpeg'});if(error){$('sv').disabled=false;return alert('Photo upload failed: '+error.message)}}
  const row={account_id:S.acc.id,vehicle_id:S.sel,kind:k.value,occurred_at:new Date($('ets').value).toISOString(),odometer_km:+$('eo').value,cost:+$('ec').value||0,note:$('en').value.trim(),photo_path:path,photo_source:pend?.src||null,photo_taken_at:pend?new Date(pend.pts).toISOString():null};
  if(k.value==='service')row.service_type_id=$('et').value;if(k.value==='fuel')row.litres=+$('el').value;if(k.value==='checkin')row.health=$('eh').value;
  const {error}=await sb.from('entries').insert(row);$('sv').disabled=false;error?alert(error.message):loadEnt();
 };
}
boot();
</script>
</body>
</html>
